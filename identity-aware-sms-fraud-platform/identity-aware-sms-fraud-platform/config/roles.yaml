# Role -> permission model (enforced in src/iam/access.py).
# Keycloak realm roles in iam/keycloak/realm-export.json use the same role names.
roles:
  fraud_analyst:
    description: First-line monitoring. Sees masked data only.
    permissions: [alerts.read, alerts.annotate]
  fraud_investigator:
    description: Investigates alerts; may unmask numbers (justified + audited) and request connection actions.
    permissions: [alerts.read, alerts.annotate, msisdn.unmask, connection.action.request]
  rule_engineer:
    description: Proposes detection rule/threshold changes. Cannot approve them.
    permissions: [rules.read, rules.propose]
  fraud_manager:
    description: Approves rule changes and connection actions (throttle/suspend).
    permissions: [alerts.read, rules.read, rules.approve, connection.action.approve]
  auditor:
    description: Read-only oversight, including the audit log.
    permissions: [alerts.read, rules.read, audit.read]
  platform_admin:
    description: Manages identities and the platform. Deliberately has NO access to fraud data.
    permissions: [users.manage, system.configure]

# Static separation of duties: one person must not hold both permissions of a pair.
separation_of_duties:
  - [rules.propose, rules.approve]
  - [connection.action.request, connection.action.approve]
  - [users.manage, alerts.read]
